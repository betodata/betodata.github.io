# Rebuilds the site and both PDF CVs from the YAML in data/, then publishes.
# Triggered by any push to main — editing data/publications.yml in the GitHub
# web editor is enough to update the site and the CV together.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'

      - run: npm ci

      - name: Build site and CVs
        run: npm run build

      - name: Check that no link is dead
        run: npm run check
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
