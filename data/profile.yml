landing:
  lede: >-
    I study how elections are manipulated, how corruption is transmitted across
    generations, and how *social norms* shape political behavior — mostly
    through field experiments and administrative data in Mexico and Latin
    America.

  secondary: >-
    Previously at the University of Chicago. Ph.D. Political Science and
    M.A. Economics, Stanford; B.Sc. Harvard College.

# [web] One-line strapline under the name on the landing page.
tagline: Elections, corruption, social norms, and the political economy of accountability.

research_interests:
  - Political intolerance and polarization
  - Social norms and civic behavior
  - Corruption and its cultural transmission
  - Electoral manipulation and electoral integrity
  - Accountability and information
  - Political economy of development

