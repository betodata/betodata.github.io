# ---------------------------------------------------------------------------
# publications.yml — THE single source of truth.
#
# Edit this file once. The website research page AND the PDF CV are both
# rendered from it. To add a paper, add a block at the top of the right list.
#
# Fields:
#   year        required. Integer. Use the publication year.
#   title       required. Plain text; no quotes needed inside unless nested.
#   coauthors   list. Omit for solo-authored work. Your own name is implicit.
#   venue       journal / press / book. Shown in both CV and web.
#   volume      e.g. "22(4): 1678-1722". Optional.
#   status      omit if published. Or: forthcoming | under-review | working-paper
#   note        e.g. award text. Appears in CV and web.
#   links       [web only] list of {type, url}. The CV ignores these.
#               types: journal | preprint | pdf | replication | data | code
#                      | appendix | preregistration | media | toc | order | review
#   abstract    [web only] optional; enables the expandable abstract on the site.
#   tags        [web only] optional; used for filtering on the research page.
#
# STATUS OF THIS DRAFT: citations transcribed from simpser_cv_july_2026.docx;
# links merged in from the current Wix site. Items marked TODO:LINK have no
# public link yet. Replication links are almost entirely missing — see the
# audit note at the bottom of this file.
# ---------------------------------------------------------------------------

